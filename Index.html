  function readQcTestFields(){
    const growth = document.getElementById('f_growth').value;
    const cloth = document.getElementById('f_cloth').value;
    const lysis = document.getElementById('f_lysis').value;
    const colourTest = document.getElementById('f_colour').value;
    const remark = document.getElementById('f_remark').value;
    if(!growth || !cloth || !lysis || !colourTest){ showToast('Fill in every test result'); return null; }
    if(!remark){ showToast('Choose a remark'); return null; }
    return {
      qcDate: document.getElementById('f_qcDate').value || todayIso(),
      growth, cloth, lysis, colourTest, remark,
      usedDate: document.getElementById('f_used').value,
      batch: document.getElementById('f_batch').value.trim()
    };
  }

  function openNewQualityLogModal(){
    const overlay = openOverlay();
    let receivedDate = todayIso();
    let containerNumber = '';
    stepContainer();

    function stepContainer(){
      overlay.innerHTML = `
        <div class="modal">
          <h2>New QC log</h2>
          <div class="field"><label>Received date</label><input type="date" id="f_received" value="${receivedDate}"></div>
          <div class="field"><label>Container number</label><input type="text" id="f_container" value="${escapeAttr(containerNumber)}" placeholder="e.g. C-2026-014"></div>
          <div class="modal-actions">
            <button class="btn-ghost" id="cancelBtn">Cancel</button>
            <button class="btn-primary" id="nextBtn">Continue</button>
          </div>
        </div>`;
      document.getElementById('cancelBtn').addEventListener('click', closeOverlay);
      document.getElementById('f_container').focus();
      document.getElementById('nextBtn').addEventListener('click', ()=>{
        const rd = document.getElementById('f_received').value || todayIso();
        const cn = document.getElementById('f_container').value.trim();
        if(!cn){ showToast('Enter a container number'); return; }
        receivedDate = rd; containerNumber = cn;
        stepFirstTest();
      });
    }
    function stepFirstTest(){
      overlay.innerHTML = `
        <div class="modal">
          <h2>QC test #1</h2>
          <div class="selected-product">
            <div class="sp-name">${escapeHtml(containerNumber)}</div>
            <div class="sp-code">Received ${fmtDate(receivedDate)}</div>
          </div>
          ${qcTestFieldsHtml()}
          <div class="modal-actions">
            <button class="btn-ghost" id="backBtn">Back</button>
            <button class="btn-ghost" id="cancelBtn">Cancel</button>
            <button class="btn-primary" id="nextBtn">Continue</button>
          </div>
        </div>`;
      document.getElementById('backBtn').addEventListener('click', stepContainer);
      document.getElementById('cancelBtn').addEventListener('click', closeOverlay);
      document.getElementById('nextBtn').addEventListener('click', ()=>{
        const test = readQcTestFields();
        if(!test) return;
        stepEnteredBy(test);
      });
    }
    function stepEnteredBy(firstTest){
      overlay.innerHTML = `
        <div class="modal">
          <h2>New QC log</h2>
          <div class="field"><label>Entered by</label><input type="text" id="f_enteredBy" placeholder="Your name"></div>
          <div class="modal-actions">
            <button class="btn-ghost" id="backBtn">Back</button>
            <button class="btn-ghost" id="cancelBtn">Cancel</button>
            <button class="btn-primary" id="saveBtn">Save log</button>
          </div>
        </div>`;
      document.getElementById('backBtn').addEventListener('click', stepFirstTest);
      document.getElementById('cancelBtn').addEventListener('click', closeOverlay);
      document.getElementById('f_enteredBy').focus();
      document.getElementById('saveBtn').addEventListener('click', ()=>{
        const enteredBy = document.getElementById('f_enteredBy').value.trim();
        if(!enteredBy){ showToast('Enter your name'); return; }
        const log = {
          id: uid(), receivedDate, containerNumber, createdBy: enteredBy,
          tests: [Object.assign({qcNo: 1}, firstTest)]
        };
        qualityLogs.push(log);
        saveData();
        closeOverlay();
        render();
        showToast('QC log saved');
        openQualityDetailModal(log.id);
      });
    }
  }

  function openEditQualityLogModal(log){
    const overlay = openOverlay();
    overlay.innerHTML = `
      <div class="modal">
        <h2>Edit QC log</h2>
        <div class="field"><label>Received date</label><input type="date" id="f_received" value="${log.receivedDate}"></div>
        <div class="field"><label>Container number</label><input type="text" id="f_container" value="${escapeAttr(log.containerNumber||'')}"></div>
        <div class="field"><label>Edited by</label><input type="text" id="f_enteredBy" value="${escapeAttr(log.updatedBy||log.createdBy||'')}" placeholder="Your name"></div>
        <div class="modal-actions">
          <button class="btn-ghost" id="cancelBtn">Cancel</button>
          <button class="btn-primary" id="saveBtn">Save changes</button>
        </div>
      </div>`;
    document.getElementById('cancelBtn').addEventListener('click', closeOverlay);
    document.getElementById('saveBtn').addEventListener('click', ()=>{
      const receivedDate = document.getElementById('f_received').value || log.receivedDate;
      const containerNumber = document.getElementById('f_container').value.trim();
      const enteredBy = document.getElementById('f_enteredBy').value.trim();
      if(!containerNumber){ showToast('Enter a container number'); return; }
      if(!enteredBy){ showToast('Enter your name'); return; }
      log.receivedDate = receivedDate;
      log.containerNumber = containerNumber;
      log.updatedBy = enteredBy;
      saveData();
      closeOverlay();
      render();
      showToast('QC log updated');
      openQualityDetailModal(log.id);
    });
  }

  function openAddQcTestModal(log){
    const overlay = openOverlay();
    const nextNo = log.tests.length ? Math.max(...log.tests.map(t=>t.qcNo)) + 1 : 1;
    overlay.innerHTML = `
      <div class="modal">
        <h2>QC test #${nextNo}</h2>
        <div class="selected-product">
          <div class="sp-name">${escapeHtml(log.containerNumber)}</div>
          <div class="sp-code">Received ${fmtDate(log.receivedDate)}</div>
        </div>
        ${qcTestFieldsHtml()}
        <div class="modal-actions">
          <button class="btn-ghost" id="cancelBtn">Cancel</button>
          <button class="btn-primary" id="saveBtn">Add QC test</button>
        </div>
      </div>`;
    document.getElementById('cancelBtn').addEventListener('click', closeOverlay);
    document.getElementById('saveBtn').addEventListener('click', ()=>{
      const test = readQcTestFields();
      if(!test) return;
      log.tests.push(Object.assign({qcNo: nextNo}, test));
      saveData();
      closeOverlay();
      render();
      showToast(`QC test #${nextNo} added`);
      openQualityDetailModal(log.id);
    });
  }

  function openEditQcTestModal(log, qcNo){
    const test = log.tests.find(t=>t.qcNo===qcNo);
    if(!test) return;
    const overlay = openOverlay();
    overlay.innerHTML = `
      <div class="modal">
        <h2>Edit QC test #${qcNo}</h2>
        <div class="selected-product">
          <div class="sp-name">${escapeHtml(log.containerNumber)}</div>
          <div class="sp-code">Received ${fmtDate(log.receivedDate)}</div>
        </div>
        ${qcTestFieldsHtml(test)}
        <div class="modal-actions">
          <button class="btn-ghost" id="cancelBtn">Cancel</button>
          <button class="btn-primary" id="saveBtn">Save changes</button>
        </div>
      </div>`;
    document.getElementById('cancelBtn').addEventListener('click', closeOverlay);
    document.getElementById('saveBtn').addEventListener('click', ()=>{
      const updated = readQcTestFields();
      if(!updated) return;
      Object.assign(test, updated);
      saveData();
      closeOverlay();
      render();
      showToast(`QC test #${qcNo} updated`);
      openQualityDetailModal(log.id);
    });
  }

  function qcField(label, value){
    return `
      <div>
        <div style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:3px;">${escapeHtml(label)}</div>
        <div style="font-size:14px;">${value}</div>
      </div>
    `;
  }
  function openQualityDetailModal(id){
    const log = qualityLogs.find(x=>x.id===id);
    if(!log) return;
    const overlay = openOverlay();
    const sortedTests = log.tests.slice().sort((a,b)=>a.qcNo-b.qcNo);
    overlay.innerHTML = `
      <div class="modal wide" style="width:720px;">
        <div class="hist-head">
          <div class="h-name">${escapeHtml(log.containerNumber)}</div>
          <div class="h-meta">Received ${fmtDate(log.receivedDate)}</div>
        </div>
        ${sortedTests.length === 0 ? `<div class="hist-empty">No QC tests logged yet.</div>` : sortedTests.map(t=>{
          const cls = t.remark==='QC passed' ? 'mv-in' : 'mv-out';
          return `
            <div class="qc-test-card" style="border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <div style="font-size:15px;font-weight:700;">QC #${t.qcNo} <span style="font-weight:400;color:var(--ink-soft);font-size:13px;">— ${fmtDate(t.qcDate)}</span></div>
                <button class="link-btn edit-qc-test-btn" data-qcno="${t.qcNo}" style="margin:0;">Edit</button>
              </div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));gap:18px 24px;">
                ${qcField('Growth', escapeHtml(t.growth||'—'))}
                ${qcField('Cloth', escapeHtml(t.cloth||'—'))}
                ${qcField('Lysis', escapeHtml(t.lysis||'—'))}
                ${qcField('Colour Test', escapeHtml(t.colourTest||'—'))}
                ${qcField('Remark', `<span class="mv-tag ${cls}">${escapeHtml(t.remark||'—')}</span>`)}
                ${qcField('Used Date', fmtDate(t.usedDate))}
                ${qcField('Batch', escapeHtml(t.batch||'—'))}
              </div>
            </div>
          `;
        }).join('')}
        <div class="modal-actions">
          <button class="btn-ghost" id="closeBtn">Close</button>
          <button class="btn-ghost" id="editLogBtn">Edit log</button>
          <button class="btn-primary" id="addTestBtn">+ Add QC test</button>
        </div>
      </div>
    `;
    document.getElementById('closeBtn').addEventListener('click', closeOverlay);
    document.getElementById('editLogBtn').addEventListener('click', ()=>{
      closeOverlay();
      openEditQualityLogModal(log);
    });
    document.getElementById('addTestBtn').addEventListener('click', ()=>{
      closeOverlay();
      openAddQcTestModal(log);
    });
    document.querySelectorAll('.edit-qc-test-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        closeOverlay();
        openEditQcTestModal(log, parseInt(b.dataset.qcno,10));
      });
    });
  }

  function csvEscape(val){
    const s = val == null ? '' : String(val);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  function downloadCSV(filename, rows){
    const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }
  function buildReportCSV(){
    if(!reportType || !reportFrom || !reportTo) return null;
    const from = reportFrom, to = reportTo;
    const inRange = (d)=> !!d && d >= from && d <= to;
    const rows = [];
    let scopeSlug = '';
    if(reportType === 'stock' || reportType === 'inventory' || reportType === 'rejection'){
      let movs;
      const productFilter = m=> !reportProductId || m.itemId===reportProductId;
      if(reportType === 'stock') movs = allMovements(m=>inRange(m.date) && productFilter(m));
      else if(reportType === 'inventory') movs = allMovements(m=>(m.type==='in'||m.type==='out_adjust') && inRange(m.date) && productFilter(m));
      else movs = allMovements(m=>m.type==='out_reject' && inRange(m.date) && productFilter(m));
      movs = movs.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      rows.push(['Date','Product','Code','Batch','Type','Qty','By']);
      movs.forEach(m=>{
        const typeLabel = m.type==='in' ? (m.stage||'Added') : (m.reason || (m.type==='out_dispatch'?'Dispatched':'Removed'));
        rows.push([fmtDate(m.date), m.itemName, m.itemCode, m.batchNumber||'', typeLabel, m.qty, movementByLabel(m)]);
      });
      if(reportProductId){ const p = items.find(i=>i.id===reportProductId); if(p) scopeSlug = `-${p.code}`; }
    } else if(reportType === 'consStock' || reportType === 'consAcq'){
      let movs;
      const consFilter = m=> !reportConsumableId || m.consId===reportConsumableId;
      if(reportType === 'consStock') movs = allConsumableMovements(m=>inRange(m.date) && consFilter(m));
      else movs = allConsumableMovements(m=>(m.type==='in'||m.type==='out_adjust') && inRange(m.date) && consFilter(m));
      movs = movs.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      rows.push(['Date','Consumable','Vendor','Lot','Type','Qty','By']);
      movs.forEach(m=>{
        const typeLabel = m.type==='in' ? 'Added' : (m.reason||'Removed');
        rows.push([fmtDate(m.date), m.consName, m.consVendor||'', m.lotNumber||'', typeLabel, m.qty, movementByLabel(m)]);
      });
      if(reportConsumableId){ const c = consumables.find(x=>x.id===reportConsumableId); if(c) scopeSlug = `-${c.name.replace(/\s+/g,'_')}`; }
    } else if(reportType === 'dispatch'){
      const groups = filteredDispatchGroups().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      rows.push(['Date','Challan #','Customer','Product','Code','Batch','Qty']);
      groups.forEach(g=>{
        g.lines.forEach(l=>{
          rows.push([fmtDate(g.date), g.challanNo, g.customer||'', l.itemName, l.itemCode, l.batchNumber||'', l.qty]);
        });
      });
      if(reportCustomerName) scopeSlug += `-${reportCustomerName.replace(/\s+/g,'_')}`;
      if(reportProductId){ const p = items.find(i=>i.id===reportProductId); if(p) scopeSlug += `-${p.code}`; }
    } else if(reportType === 'materialRequests'){
      const reqs = materialRequests.filter(r=>inRange(r.date)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      rows.push(['Date','Request #','Requested By','Status','Item','Qty']);
      reqs.forEach(r=>{
        const status = requestAllGiven(r) ? 'Given' : 'Pending';
        r.items.forEach(it=>{
          rows.push([fmtDate(r.date), r.requestNo, r.requesterName, status, it.consumableName, it.qty]);
        });
      });
    }
    return {filename: `report-${reportType}${scopeSlug}-${reportFrom}-to-${reportTo}.csv`, rows};
  }
  function filteredDispatchGroups(){
    const from = reportFrom, to = reportTo;
    const inRange = (d)=> !!d && d >= from && d <= to;
    const productCode = reportProductId ? (items.find(i=>i.id===reportProductId)||{}).code : '';
    return dispatchChallanGroups()
      .filter(g=>inRange(g.date))
      .filter(g=> !reportCustomerName || g.customer === reportCustomerName)
      .map(g=>{
        if(!productCode) return g;
        const lines = g.lines.filter(l=>l.itemCode === productCode);
        const totalQty = lines.reduce((s,l)=>s+l.qty,0);
        return Object.assign({}, g, {lines, totalQty});
      })
      .filter(g=> g.lines.length > 0);
  }
  function reportResultsHtml(){
    const from = reportFrom, to = reportTo;
    const inRange = (d)=> !!d && d >= from && d <= to;
    if(reportType === 'stock'){
      return renderMovementReport(allMovements(m=>inRange(m.date) && (!reportProductId || m.itemId===reportProductId)), 'product');
    } else if(reportType === 'consStock'){
      return renderMovementReport(allConsumableMovements(m=>inRange(m.date) && (!reportConsumableId || m.consId===reportConsumableId)), 'consumable');
    } else if(reportType === 'inventory'){
      return renderMovementReport(allMovements(m=>(m.type==='in'||m.type==='out_adjust') && inRange(m.date) && (!reportProductId || m.itemId===reportProductId)), 'product');
    } else if(reportType === 'consAcq'){
      return renderMovementReport(allConsumableMovements(m=>(m.type==='in'||m.type==='out_adjust') && inRange(m.date) && (!reportConsumableId || m.consId===reportConsumableId)), 'consumable');
    } else if(reportType === 'rejection'){
      return renderMovementReport(allMovements(m=>m.type==='out_reject' && inRange(m.date) && (!reportProductId || m.itemId===reportProductId)), 'product');
    } else if(reportType === 'dispatch'){
      return renderDispatchReport(filteredDispatchGroups());
    } else if(reportType === 'materialRequests'){
      return renderMaterialRequestReport(materialRequests.filter(r=>inRange(r.date)));
    }
    return '';
  }
  function renderMovementReport(rows, kind){
    if(!rows.length) return `<div class="empty"><p>No activity in this range.</p></div>`;
    const sorted = rows.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const totalIn = sorted.filter(m=>m.type==='in').reduce((s,m)=>s+m.qty,0);
    const totalOut = sorted.filter(m=>m.type!=='in').reduce((s,m)=>s+m.qty,0);
    return `
      <p class="current-stock">Entries: <span class="num">${sorted.length}</span> &nbsp; Added: <span class="num">${totalIn}</span> &nbsp; Removed/Used: <span class="num">${totalOut}</span></p>
      <table class="activity-table">
        <thead><tr><th>Date</th><th>${kind==='product'?'Product':'Consumable'}</th><th>${kind==='product'?'Code':'Vendor'}</th><th>${kind==='product'?'Batch':'Lot'}</th><th>Type</th><th class="num-col">Qty</th><th>By</th></tr></thead>
        <tbody>
          ${sorted.map(m=>{
            const typeLabel = m.type==='in' ? (m.stage||'Added') : (m.reason || (m.type==='out_dispatch'?'Dispatched':'Removed'));
            const name = kind==='product' ? m.itemName : m.consName;
            const code = kind==='product' ? m.itemCode : (m.consVendor||'—');
            const batch = kind==='product' ? (m.batchNumber||'—') : (m.lotNumber||'—');
            return `<tr>
              <td>${fmtDate(m.date)}</td>
              <td>${escapeHtml(name)}</td>
              <td class="sku-cell">${escapeHtml(code)}</td>
              <td>${escapeHtml(batch)}</td>
              <td><span class="mv-tag ${m.type==='in'?'mv-in':'mv-out'}">${escapeHtml(typeLabel)}</span></td>
              <td class="num-col num">${m.qty}</td>
              <td class="cat-cell">${escapeHtml(movementByLabel(m))}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;
  }
  function renderDispatchReport(groups){
    if(!groups.length) return `<div class="empty"><p>No dispatches in this range.</p></div>`;
    const sorted = groups.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const totalQty = sorted.reduce((s,g)=>s+g.totalQty,0);
    return `
      <p class="current-stock">Challans: <span class="num">${sorted.length}</span> &nbsp; Total Qty: <span class="num">${totalQty}</span></p>
      <table class="activity-table">
        <thead><tr><th>Date</th><th>Challan #</th><th>Customer</th><th>Items</th><th class="num-col">Qty</th></tr></thead>
        <tbody>
          ${sorted.map(g=>{
            const distinct = new Set(g.lines.map(l=>l.itemCode)).size;
            return `<tr>
              <td>${fmtDate(g.date)}</td>
              <td class="sku-cell">${escapeHtml(g.challanNo)}</td>
              <td>${escapeHtml(g.customer||'—')}</td>
              <td>${distinct} product${distinct===1?'':'s'}</td>
              <td class="num-col num">${g.totalQty}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;
  }
  function renderMaterialRequestReport(rows){
    if(!rows.length) return `<div class="empty"><p>No requests in this range.</p></div>`;
    const sorted = rows.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    return `
      <table class="activity-table">
        <thead><tr><th>Date</th><th>Request #</th><th>Requested By</th><th>Status</th></tr></thead>
        <tbody>
          ${sorted.map(r=>`
            <tr>
              <td>${fmtDate(r.date)}</td>
              <td class="sku-cell">${escapeHtml(r.requestNo)}</td>
              <td>${escapeHtml(r.requesterName)}</td>
              <td>${requestAllGiven(r) ? `<span class="mv-tag mv-in">&#10003; Given</span>` : `<span class="mv-tag mv-out">Pending</span>`}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

      });
    } else if(settingsView === 'reports'){
      document.getElementById('rpt_type').addEventListener('change', (e)=>{
        reportType = e.target.value;
        reportProductId = '';
        reportConsumableId = '';
        reportCustomerName = '';
        render();
      });
      document.getElementById('rpt_from').addEventListener('change', (e)=>{ reportFrom = e.target.value; });
      document.getElementById('rpt_to').addEventListener('change', (e)=>{ reportTo = e.target.value; });
      const prodSearchInput = document.getElementById('rpt_productSearch');
      const prodResultsEl = document.getElementById('rpt_productResults');
      if(prodSearchInput && prodResultsEl){
        function paintProductResults(){
          const q = prodSearchInput.value.trim().toLowerCase();
          const pool = items.slice().sort((a,b)=>a.name.localeCompare(b.name));
          const matches = !q ? pool.slice(0,8) : pool.filter(it=>
            it.name.toLowerCase().includes(q) || it.code.toLowerCase().includes(q)
          ).slice(0,20);
          prodResultsEl.innerHTML = `
            <div class="result-row" data-id="">All products</div>
            ${matches.map(it=>`<div class="result-row" data-id="${it.id}"><span class="result-name">${escapeHtml(it.name)}</span></div>`).join('')}
          `;
          prodResultsEl.querySelectorAll('.result-row').forEach(r=>{
            r.addEventListener('click', ()=>{
              reportProductId = r.dataset.id;
              prodSearchInput.value = r.dataset.id ? items.find(i=>i.id===r.dataset.id).name : '';
              prodResultsEl.style.display = 'none';
            });
          });
          prodResultsEl.style.display = 'block';
        }
        prodSearchInput.addEventListener('input', paintProductResults);
        prodSearchInput.addEventListener('focus', paintProductResults);
        document.addEventListener('click', (e)=>{
          if(!prodSearchInput.contains(e.target) && !prodResultsEl.contains(e.target)){
            prodResultsEl.style.display = 'none';
          }
        });
      }
      const consSel = document.getElementById('rpt_consumable');
      if(consSel) consSel.addEventListener('change', (e)=>{ reportConsumableId = e.target.value; });
      const custSel = document.getElementById('rpt_customer');
      if(custSel) custSel.addEventListener('change', (e)=>{ reportCustomerName = e.target.value; });
      document.getElementById('rpt_week').addEventListener('click', ()=>{
        const now = new Date();
        const day = now.getDay();
        const diff = (day === 0 ? -6 : 1 - day);
        const monday = new Date(now); monday.setDate(now.getDate() + diff);
        const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
        reportFrom = monday.toISOString().slice(0,10);
        reportTo = sunday.toISOString().slice(0,10);
        render();
      });
      document.getElementById('rpt_month').addEventListener('click', ()=>{
        const now = new Date();
        const first = new Date(now.getFullYear(), now.getMonth(), 1);
        const last = new Date(now.getFullYear(), now.getMonth()+1, 0);
        reportFrom = first.toISOString().slice(0,10);
        reportTo = last.toISOString().slice(0,10);
        render();
      });
      document.getElementById('rpt_generate').addEventListener('click', ()=>{
        reportType = document.getElementById('rpt_type').value;
        reportFrom = document.getElementById('rpt_from').value;
        reportTo = document.getElementById('rpt_to').value;
        const consSel2 = document.getElementById('rpt_consumable');
        if(consSel2) reportConsumableId = consSel2.value;
        const custSel2 = document.getElementById('rpt_customer');
        if(custSel2) reportCustomerName = custSel2.value;
        if(!reportType){ showToast('Choose a report'); return; }
        if(!reportFrom || !reportTo){ showToast('Choose a date range'); return; }
        if(reportFrom > reportTo){ showToast('"From" date must be before "To" date'); return; }
        render();
      });
      const downloadBtn = document.getElementById('rpt_download');
      if(downloadBtn) downloadBtn.addEventListener('click', ()=>{
        const csvData = buildReportCSV();
        if(!csvData || csvData.rows.length <= 1){ showToast('No data to download for this range'); return; }
        downloadCSV(csvData.filename, csvData.rows);
        showToast('Report downloaded');
      });
    }
  }

  function openDeleteConsumableModal(){
    const overlay = openOverlay();
    step1();
    function step1(){

        title: 'Delete consumable',
        subtitle: 'Find the consumable to permanently remove.',
        onCancel: closeOverlay,

          <div class="modal-actions">
            <button class="btn-ghost" id="cancelBtn">Cancel</button>
            <button class="btn-orange" id="confirmBtn">Delete permanently</button>
          </div>
        </div>`;
      document.getElementById('cancelBtn').addEventListener('click', closeOverlay);
      document.getElementById('confirmBtn').addEventListener('click', ()=>{
        consumables = consumables.filter(x=>x.id!==c.id);
        saveData();
        closeOverlay();
        render();

  function openAddProductModal(){
    const overlay = openOverlay();
    paint();
    function paint(){
      overlay.innerHTML = `
        <div class="modal">
          <h2>Add product</h2>
          <div class="field"><label>Product name</label><input type="text" id="f_name"></div>
          <div class="field-row">
            <div class="field"><label>Code</label><input type="text" id="f_code"></div>
            <div class="field"><label>Pack size</label><input type="text" id="f_packsize" placeholder="e.g. 500, Per pc"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Low-stock quantity (optional)</label><input type="number" id="f_reorder" min="0" placeholder="Uses category default"></div>
            <div class="field">
              <label>Category</label>
              <select id="f_cat">
                <option value="">No category</option>
                ${categories.map(c=>`<option value="${escapeAttr(c.name)}">${escapeHtml(c.name)}</option>`).join('')}
                <option value="__new__">+ New category…</option>
              </select>
            </div>
          </div>
          <div class="field" id="newCatField" style="display:none;">
            <label>New category name</label>
            <input type="text" id="f_newcat">
          </div>
          <div class="modal-actions">
            <button class="btn-ghost" id="cancelBtn">Cancel</button>
            <button class="btn-primary" id="saveBtn">Add product</button>
          </div>
        </div>`;
      document.getElementById('cancelBtn').addEventListener('click', closeOverlay);
      document.getElementById('f_name').focus();
      document.getElementById('f_cat').addEventListener('change', (e)=>{
        document.getElementById('newCatField').style.display = e.target.value==='__new__' ? 'block' : 'none';
      });
      document.getElementById('saveBtn').addEventListener('click', ()=>{
        const name = document.getElementById('f_name').value.trim();
        const code = document.getElementById('f_code').value.trim();
        const packSize = document.getElementById('f_packsize').value.trim();
        const reorderVal = document.getElementById('f_reorder').value;
        const catSelect = document.getElementById('f_cat').value;
        let category = catSelect;
        if(catSelect === '__new__'){
          const newCat = document.getElementById('f_newcat').value.trim();
          if(!newCat){ showToast('Enter a name for the new category'); return; }
          if(!categories.some(c=>c.name===newCat)) categories.push({name:newCat, trackExpiry:true, trackBatch:true, trackLowStock:true, lowStockQty:0, shelfLifeDays:0});
          category = newCat;
        }
        if(!name){ showToast('Enter a product name'); return; }
        const newItem = {id:uid(), code, name, packSize, category, reorder:0, movements:[]};
        if(reorderVal !== '') newItem.reorderOverride = Math.max(0, parseInt(reorderVal,10) || 0);
        items.push(newItem);
        saveData();
        closeOverlay();
        render();
        showToast(`Added ${name}`);
      });
    }
  }

  function openDeleteProductModal(){
    const overlay = openOverlay();
    step1();
    function step1(){
      renderProductSearchStep(overlay, {
        title: 'Delete product',
        subtitle: 'Find the product to permanently remove.',
        onCancel: closeOverlay,
        onPick: (it)=> step2(it)
      });
    }
    function step2(it){
      overlay.innerHTML = `

          <h2>Delete product</h2>
          <div class="selected-product">
            <div class="sp-name">${escapeHtml(it.name)}</div>
            <div class="sp-code">${escapeHtml(it.code)} · ${escapeHtml(it.category||'No category')}${it.packSize?` · ${escapeHtml(it.packSize)}`:''}</div>
          </div>
          <p class="page-intro">This permanently deletes the product and all of its history — batches, rejections, and dispatches. This can't be undone.</p>
          <div class="modal-actions">
            <button class="btn-ghost" id="cancelBtn">Cancel</button>
            <button class="btn-orange" id="confirmBtn">Delete permanently</button>
          </div>

      document.getElementById('cancelBtn').addEventListener('click', closeOverlay);
      document.getElementById('confirmBtn').addEventListener('click', ()=>{
        items = items.filter(i=>i.id!==it.id);
        saveData();
        closeOverlay();
        render();
        showToast(`Deleted ${it.name}`);
      });
    }
  }

  function openAddUserModal(){
    const overlay = openOverlay();
    overlay.innerHTML = `
      <div class="modal">
        <h2>Add user</h2>
        <div class="field-row">
          <div class="field"><label>Login ID</label><input type="text" id="f_loginId"></div>
          <div class="field"><label>Password</label><input type="text" id="f_password"></div>
        </div>
        <div class="field">
          <label>Dashboard access</label>
          <div class="checkbox-list">
            <label class="cb-row"><input type="checkbox" id="perm_stock" checked> Inventory Management</label>
            <label class="cb-row"><input type="checkbox" id="perm_inventory" checked> Production / Acquisition</label>
            <label class="cb-row"><input type="checkbox" id="perm_consStock" checked> Consumable Inventory</label>
            <label class="cb-row"><input type="checkbox" id="perm_consAcq" checked> Consumable Acquisition</label>
            <label class="cb-row"><input type="checkbox" id="perm_rejection" checked> Rejection &amp; Contamination</label>
            <label class="cb-row"><input type="checkbox" id="perm_dispatch" checked> Dispatch</label>
            <label class="cb-row"><input type="checkbox" id="perm_quotations" checked> Quotations</label>
            <label class="cb-row"><input type="checkbox" id="perm_materialRequests" checked> Material Issue Request</label>
            <label class="cb-row"><input type="checkbox" id="perm_purchaseOrders" checked> Purchase Order Entry</label>
            <label class="cb-row"><input type="checkbox" id="perm_quality"> Quality Control</label>
            <label class="cb-row"><input type="checkbox" id="perm_settings"> Settings</label>
            <label class="cb-row"><input type="checkbox" id="perm_users"> Users (in Settings)</label>
            <label class="cb-row"><input type="checkbox" id="perm_reports"> Reports (in Settings)</label>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-ghost" id="cancelBtn">Cancel</button>
          <button class="btn-primary" id="saveBtn">Add user</button>
        </div>
      </div>`;
    document.getElementById('cancelBtn').addEventListener('click', closeOverlay);
    document.getElementById('f_loginId').focus();
    document.getElementById('saveBtn').addEventListener('click', ()=>{
      const loginId = document.getElementById('f_loginId').value.trim();
      const password = document.getElementById('f_password').value;
      if(!loginId || !password){ showToast('Enter a login ID and password'); return; }
      if(users.some(u=>u.loginId.toLowerCase()===loginId.toLowerCase())){ showToast('That login ID is already in use'); return; }
      const permissions = {
        stock: document.getElementById('perm_stock').checked,
        inventory: document.getElementById('perm_inventory').checked,
        consStock: document.getElementById('perm_consStock').checked,
        consAcq: document.getElementById('perm_consAcq').checked,
        rejection: document.getElementById('perm_rejection').checked,
        dispatch: document.getElementById('perm_dispatch').checked,
        quotations: document.getElementById('perm_quotations').checked,
        materialRequests: document.getElementById('perm_materialRequests').checked,
        purchaseOrders: document.getElementById('perm_purchaseOrders').checked,
        quality: document.getElementById('perm_quality').checked,
        settings: document.getElementById('perm_settings').checked,
        users: document.getElementById('perm_users').checked,
        reports: document.getElementById('perm_reports').checked,
      };
      users.push({loginId, password, permissions});
      saveData();
      closeOverlay();
      render();
      showToast(`Added user ${loginId}`);
    });
  }
  function removeUser(loginId){
    if(loginId === 'smp') return;
    if(confirm(`Remove user "${loginId}"? They'll no longer be able to sign in.`)){
      users = users.filter(u=>u.loginId !== loginId);
      saveData();
      render();
    }
  }
  function openResetPasswordModal(loginId){
    const u = users.find(x=>x.loginId===loginId);
    if(!u) return;
    const overlay = openOverlay();
    overlay.innerHTML = `
      <div class="modal">
        <h2>Reset password</h2>
        <p class="page-intro">Set a new password for <strong>${escapeHtml(loginId)}</strong>.</p>
        <div class="field"><label>New password</label><input type="password" id="f_newPw" autocomplete="new-password"></div>
        <div class="field"><label>Confirm new password</label><input type="password" id="f_confirmPw" autocomplete="new-password"></div>
        <div class="login-error" id="pwError" style="display:none;"></div>
        <div class="modal-actions">
          <button class="btn-ghost" id="cancelBtn">Cancel</button>
          <button class="btn-primary" id="saveBtn">Save new password</button>
        </div>
      </div>`;
    document.getElementById('cancelBtn').addEventListener('click', closeOverlay);
    document.getElementById('f_newPw').focus();
    document.getElementById('saveBtn').addEventListener('click', ()=>{
      const next = document.getElementById('f_newPw').value;
      const confirm2 = document.getElementById('f_confirmPw').value;
      const errEl = document.getElementById('pwError');
      if(!next){ errEl.textContent = 'Enter a new password.'; errEl.style.display = 'block'; return; }
      if(next !== confirm2){ errEl.textContent = "New passwords don't match."; errEl.style.display = 'block'; return; }
      u.password = next;
      if(loggedInUser && loggedInUser.loginId === loginId) loggedInUser.password = next;
      saveData();
      closeOverlay();
      showToast(`Password reset for ${loginId}`);
    });
  }

  function openAddCustomerModal(){
    const overlay = openOverlay();
    overlay.innerHTML = `
      <div class="modal">
        <h2>Add customer</h2>
        <div class="field"><label>Customer name</label><input type="text" id="f_custName"></div>
        <div class="field"><label>Address</label><textarea id="f_custAddress" rows="3" placeholder="One line per address line"></textarea></div>
        <div class="field"><label>Contact number</label><input type="text" id="f_custContact" placeholder="Optional"></div>
        <div class="field"><label>GSTIN</label><input type="text" id="f_custGstin" placeholder="Optional"></div>
        <div class="modal-actions">
          <button class="btn-ghost" id="cancelBtn">Cancel</button>
          <button class="btn-primary" id="saveBtn">Add customer</button>
        </div>
      </div>`;
    document.getElementById('cancelBtn').addEventListener('click', closeOverlay);
    const nameInput = document.getElementById('f_custName');
    const addressInput = document.getElementById('f_custAddress');
    nameInput.focus();
    nameInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') addressInput.focus(); });
    document.getElementById('saveBtn').addEventListener('click', ()=>{
      const name = nameInput.value.trim();
      const address = addressInput.value.trim();
      const contactNumber = document.getElementById('f_custContact').value.trim();
      const gstin = document.getElementById('f_custGstin').value.trim();
      if(!name){ showToast('Enter a customer name'); return; }
      if(!address){ showToast('Enter a delivery address'); return; }
      if(customers.some(c=>c.name.toLowerCase()===name.toLowerCase())){ showToast('That customer already exists'); return; }
      customers.push({id: uid(), name, address, contactNumber, gstin});
      saveData();
      closeOverlay();
      render();
      showToast(`Added ${name}`);
    });
  }
  function removeCustomer(id){
    const c = customers.find(x=>x.id===id);
    if(!c) return;
    if(confirm(`Remove "${c.name}" from your customer list?`)){
      customers = customers.filter(x=>x.id!==id);
      saveData();
      render();
    }
  }

  // ---------------- boot ----------------
  render();
  loadData();
})();
</script>
